<!-- @dsCard group="Colors" viewport="700x160" name="Ink & chalk" subtitle="Neutrals, named for the ground" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:14px;background:var(--paper)}.g{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}.s{height:70px;border-radius:6px;border:1px solid rgba(28,27,23,.08)}.l{font:500 10.5px/1.45 var(--font-mono);color:var(--ink-3);margin-top:6px}.l b{display:block;font-weight:600;color:var(--ink)}</style>
</head><body><div class="g">
<div><div class="s" style="background:var(--chalk)"></div><div class="l"><b>--chalk</b>#F2F0E9 · app bg</div></div>
<div><div class="s" style="background:var(--paper)"></div><div class="l"><b>--paper</b>#FFFFFF · cards</div></div>
<div><div class="s" style="background:var(--line)"></div><div class="l"><b>--line</b>#DED9CC · hairline</div></div>
<div><div class="s" style="background:var(--line-strong)"></div><div class="l"><b>--line-strong</b>#C6C0AF</div></div>
<div><div class="s" style="background:var(--ink-3)"></div><div class="l"><b>--ink-3</b>#7D786C · muted</div></div>
<div><div class="s" style="background:var(--ink-2)"></div><div class="l"><b>--ink-2</b>#4C4A42</div></div>
<div><div class="s" style="background:var(--ink)"></div><div class="l"><b>--ink</b>#1C1B17 · text, primary</div></div>
</div></body></html>
