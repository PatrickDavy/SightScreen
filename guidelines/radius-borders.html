<!-- @dsCard group="Spacing" viewport="700x170" name="Radii & borders" subtitle="4 controls · 8 cards · pill tags · crease lines" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--paper);display:flex;gap:24px;align-items:flex-start}.l{font:500 10.5px/1.5 var(--font-mono);color:var(--ink-3);margin-top:6px}</style>
</head><body>
<div><div style="width:96px;height:60px;background:var(--chalk);border-radius:var(--radius-1)"></div><div class="l">--radius-1 4px<br>buttons, inputs</div></div>
<div><div style="width:96px;height:60px;background:var(--chalk);border-radius:var(--radius-2)"></div><div class="l">--radius-2 8px<br>cards, dialogs</div></div>
<div><div style="width:96px;height:28px;background:var(--chalk);border-radius:var(--radius-pill);margin-top:16px"></div><div class="l" style="margin-top:22px">--radius-pill<br>tags only</div></div>
<div><div style="width:120px;height:60px;background:var(--paper);border:var(--border-hair);border-radius:8px"></div><div class="l">--border-hair 1px<br>dividers, card edges</div></div>
<div><div style="width:120px;height:60px;background:var(--paper);border:var(--border-strong);border-radius:4px"></div><div class="l">--border-strong 1.5px ink<br>interactive outlines</div></div>
</body></html>
