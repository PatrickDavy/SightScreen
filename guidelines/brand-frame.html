<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--paper);display:flex;gap:18px}</style>
</head><body>
<div style="position:relative;width:320px;height:170px;background:var(--ink);border-radius:var(--radius-2);overflow:hidden;flex:none">
<div style="position:absolute;left:24px;right:24px;top:20px;bottom:34px;border:1.5px solid var(--chalk);border-radius:2px"></div>
<div style="position:absolute;left:0;right:0;bottom:34px;height:1.5px;background:rgba(242,240,233,.45)"></div>
<div style="position:absolute;left:0;right:0;bottom:12px;text-align:center;font:500 9.5px/1 var(--font-mono);letter-spacing:.1em;color:rgba(242,240,233,.75)">KEEP THE BOWLER INSIDE THE FRAME</div>
</div>
<div style="font:400 12.5px/1.6 var(--font-ui);color:var(--ink-2);max-width:300px">Video and camera areas are flat ink blocks. A chalk 1.5px rectangle marks where the bowler belongs — the sightscreen itself. The same rectangle anchors empty states. The horizontal line is the crease.</div>
</body></html>
