<!-- @dsCard group="Spacing" viewport="700x180" name="Elevation" subtitle="Flat by default — sunlight legibility" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px;background:var(--chalk);display:flex;gap:20px}.b{width:180px;height:90px;background:var(--paper);border-radius:var(--radius-2);padding:12px;font:600 13px/1.3 var(--font-ui)}.l{font:500 10.5px/1.5 var(--font-mono);color:var(--ink-3);margin-top:8px}</style>
</head><body>
<div><div class="b" style="border:var(--border-hair)">Flat</div><div class="l">default card — border does the work, no shadow</div></div>
<div><div class="b" style="border:var(--border-hair);box-shadow:var(--shadow-1)">Raised</div><div class="l">--shadow-1 · sparingly</div></div>
<div><div class="b" style="box-shadow:var(--shadow-2)">Overlay</div><div class="l">--shadow-2 · dialogs and toasts only</div></div>
</body></html>
