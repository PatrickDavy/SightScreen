<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:14px;background:var(--paper)}.g{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.s{height:70px;border-radius:6px;border:1px solid rgba(28,27,23,.08)}.l{font:500 10.5px/1.45 var(--font-mono);color:var(--ink-3);margin-top:6px}.l b{display:block;font-weight:600;color:var(--ink)}.n{font:400 12px/1.5 var(--font-ui);color:var(--ink-2);margin-top:10px}</style>
</head><body><div class="g">
<div><div class="s" style="background:var(--cherry)"></div><div class="l"><b>--cherry</b>#B02A19</div></div>
<div><div class="s" style="background:var(--cherry-deep)"></div><div class="l"><b>--cherry-deep</b>#8C2013 · hover</div></div>
<div><div class="s" style="background:var(--cherry-soft)"></div><div class="l"><b>--cherry-soft</b>#E9836F · on ink</div></div>
<div><div class="s" style="background:var(--cherry-tint)"></div><div class="l"><b>--cherry-tint</b>#F7E9E4 · fills</div></div>
</div><div class="n">Ball-leather red. Reserved for the one thing, the record button, over-limit alarms and links. Primary buttons are ink, not cherry.</div></body></html>
