<!-- @dsCard group="Motion" viewport="700x170" name="Motion" subtitle="Quick and matter-of-fact — hover the blocks" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--paper);display:flex;gap:20px;align-items:flex-start}
.d{width:150px;height:64px;background:var(--ink);color:var(--chalk);border-radius:var(--radius-1);display:flex;align-items:center;justify-content:center;font:600 13px/1 var(--font-ui);cursor:pointer}
.d1{transition:transform var(--dur-1) var(--ease-swift),background var(--dur-1) var(--ease-swift)}.d1:hover{background:#000;transform:translateY(1px)}
.d2{transition:transform var(--dur-2) var(--ease-swift)}.d2:hover{transform:translateX(12px)}
.d3{transition:opacity var(--dur-3) var(--ease-swift)}.d3:hover{opacity:.35}
.l{font:500 10.5px/1.5 var(--font-mono);color:var(--ink-3);margin-top:8px}</style>
</head><body>
<div><div class="d d1">press</div><div class="l">--dur-1 120ms<br>hover, press</div></div>
<div><div class="d d2">slide</div><div class="l">--dur-2 200ms<br>toggles, tabs</div></div>
<div><div class="d d3">fade</div><div class="l">--dur-3 320ms<br>dialogs, screens</div></div>
<div style="font:400 12px/1.55 var(--font-ui);color:var(--ink-2);max-width:180px">--ease-swift cubic-bezier(.2,0,0,1). Fades and small translates only — no bounces, springs or parallax.</div>
</body></html>
