<!-- @dsCard group="Brand" viewport="700x210" name="Error band" subtitle="The signature motif — value ± band over a track" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px;background:var(--paper)}.lbl{font:500 10.5px/1.4 var(--font-mono);color:var(--ink-3)}</style>
</head><body>
<div style="display:flex;align-items:baseline;gap:8px"><span style="font:700 40px/1 var(--font-display)">38</span><span style="font:500 14px/1 var(--font-mono);color:var(--ink-2)">°</span><span style="font:400 12px/1 var(--font-mono);color:var(--ink-3)">±5° · front knee flexion at contact</span></div>
<div style="position:relative;height:6px;background:var(--band-track);border-radius:3px;margin-top:18px;max-width:560px">
<div style="position:absolute;top:0;bottom:0;left:2%;width:31%;background:var(--turf-soft);opacity:.55;border-radius:3px"></div>
<div style="position:absolute;top:0;bottom:0;left:55%;width:16.6%;background:var(--ink);border-radius:3px"></div>
<div style="position:absolute;top:-3px;bottom:-3px;left:calc(63.3% - 1px);width:2px;background:var(--cherry)"></div>
</div>
<div style="display:flex;gap:26px;margin-top:12px">
<span class="lbl"><span style="display:inline-block;width:10px;height:6px;background:var(--turf-soft);border-radius:2px;margin-right:5px"></span>target zone</span>
<span class="lbl"><span style="display:inline-block;width:10px;height:6px;background:var(--ink);border-radius:2px;margin-right:5px"></span>your interval (value ± band)</span>
<span class="lbl"><span style="display:inline-block;width:2px;height:9px;background:var(--cherry);margin-right:5px"></span>point estimate</span>
</div>
</body></html>
