<!-- @dsCard group="Icons" viewport="700x200" name="Iconography" subtitle="Lucide via CDN — stroke 2, no emoji, no drawn SVGs" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<script src="https://unpkg.com/lucide@latest"></script>
<style>body{margin:0;padding:16px;background:var(--paper)}.g{display:grid;grid-template-columns:repeat(8,1fr);gap:14px 8px}.c{text-align:center;color:var(--ink)}.c svg{width:20px;height:20px}.l{font:400 9.5px/1.3 var(--font-mono);color:var(--ink-3);margin-top:5px}</style>
</head><body><div class="g">
<div class="c"><i data-lucide="video"></i><div class="l">video</div></div>
<div class="c"><i data-lucide="list"></i><div class="l">list</div></div>
<div class="c"><i data-lucide="shield"></i><div class="l">shield</div></div>
<div class="c"><i data-lucide="target"></i><div class="l">target</div></div>
<div class="c"><i data-lucide="ruler"></i><div class="l">ruler</div></div>
<div class="c"><i data-lucide="clock"></i><div class="l">clock</div></div>
<div class="c"><i data-lucide="sun"></i><div class="l">sun</div></div>
<div class="c"><i data-lucide="settings"></i><div class="l">settings</div></div>
<div class="c"><i data-lucide="chevron-right"></i><div class="l">chevron-right</div></div>
<div class="c"><i data-lucide="check"></i><div class="l">check</div></div>
<div class="c"><i data-lucide="x"></i><div class="l">x</div></div>
<div class="c"><i data-lucide="circle-check"></i><div class="l">circle-check</div></div>
<div class="c"><i data-lucide="triangle-alert"></i><div class="l">triangle-alert</div></div>
<div class="c"><i data-lucide="octagon-alert"></i><div class="l">octagon-alert</div></div>
<div class="c"><i data-lucide="info"></i><div class="l">info</div></div>
<div class="c"><i data-lucide="play"></i><div class="l">play</div></div>
</div>
<div style="font:400 11.5px/1.5 var(--font-ui);color:var(--ink-2);margin-top:12px">Substituted set (nothing was provided): Lucide, even 2px stroke. Sizes 16/18/20; color inherits. Icons always carry a text label except in IconButton.</div>
<script>lucide.createIcons();</script>
</body></html>
