<!-- @dsCard group="Colors" viewport="700x190" name="Status" subtitle="Good / watch / over — workload and bands" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:14px;background:var(--paper)}.g{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.r{display:flex;gap:6px}.s{flex:1;height:56px;border-radius:6px;border:1px solid rgba(28,27,23,.08)}.h{font:700 11px/1 var(--font-ui);letter-spacing:.07em;text-transform:uppercase;margin-bottom:8px}.l{font:500 10.5px/1.5 var(--font-mono);color:var(--ink-3);margin-top:6px}</style>
</head><body><div class="g">
<div><div class="h" style="color:var(--turf)">Good — within band</div><div class="r"><div class="s" style="background:var(--turf)"></div><div class="s" style="background:var(--turf-soft)"></div><div class="s" style="background:var(--turf-tint)"></div></div><div class="l">--turf #2F6B3C · -soft · -tint</div></div>
<div><div class="h" style="color:var(--amber)">Watch — near limit</div><div class="r"><div class="s" style="background:var(--amber)"></div><div class="s" style="background:var(--amber-soft)"></div><div class="s" style="background:var(--amber-tint)"></div></div><div class="l">--amber #A56E00 · -soft · -tint</div></div>
<div><div class="h" style="color:var(--cherry)">Over — past limit</div><div class="r"><div class="s" style="background:var(--over)"></div><div class="s" style="background:var(--cherry-soft)"></div><div class="s" style="background:var(--over-bg)"></div></div><div class="l">--over → cherry · -soft · -bg</div></div>
</div></body></html>
