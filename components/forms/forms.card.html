<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>body{margin:0;padding:16px;background:var(--chalk)}</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="../../_ds_bundle.js"></script>
</head><body><div id="root"></div>
<script type="text/babel">
const { Input, Select, Checkbox, Radio, Switch } = window.SightscreenDesignSystem_9d8748;
function Demo() {
  const [age, setAge] = React.useState('U17');
  const [arm, setArm] = React.useState('right');
  const [rem, setRem] = React.useState(true);
  const [slo, setSlo] = React.useState(false);
  return (
    <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '16px 20px' }}>
      <Input label="Height" suffix="cm" placeholder="178" inputMode="numeric" hint="Used to scale release height." />
      <Input label="Club" icon="search" placeholder="Find your club" error="No club by that name — check the spelling." />
      <Select label="Age group" options={["U13","U15","U17","U19","Open"]} value={age} onChange={e => setAge(e.target.value)} hint="Sets your workload guideline." />
      <div style={{ display: 'grid', gap: 10, alignContent: 'start' }}>
        <div style={{ display: 'flex', gap: 16 }}>
          <Radio name="arm" value="right" label="Right arm" checked={arm === 'right'} onChange={setArm} />
          <Radio name="arm" value="left" label="Left arm" checked={arm === 'left'} onChange={setArm} />
        </div>
        <Checkbox label="Remind me before I hit the weekly limit" checked={rem} onChange={setRem} />
        <Switch label="Slow-motion playback" checked={slo} onChange={setSlo} />
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script></body></html>
